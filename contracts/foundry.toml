[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Whitechain docs: verification fails if the compiler differs. Use 0.8.30 + prague.
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
whitechain_sepolia = "${WHITECHAIN_RPC_URL}"
