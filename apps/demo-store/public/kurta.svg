<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="A hand-block printed cotton kurta">
  <rect width="400" height="500" fill="#f5ecdf"/>
  <!-- kurta body and sleeves -->
  <path d="M150 70 L120 82 L64 150 L92 176 L128 140 L124 450 L276 450 L272 140 L308 176 L336 150 L280 82 L250 70 Q200 98 150 70 Z" fill="#fbf6ee" stroke="#8a7b6b" stroke-width="2"/>
  <!-- placket -->
  <path d="M200 86 L200 170" stroke="#9a3412" stroke-width="3"/>
  <circle cx="208" cy="110" r="3" fill="#9a3412"/><circle cx="208" cy="132" r="3" fill="#9a3412"/><circle cx="208" cy="154" r="3" fill="#9a3412"/>
  <!-- block-print motifs in rows -->
  <g fill="#2f3e5c">
    <g id="row">
      <path d="M148 200 l8 -8 l8 8 l-8 8 z"/><path d="M180 200 l8 -8 l8 8 l-8 8 z"/><path d="M212 200 l8 -8 l8 8 l-8 8 z"/><path d="M244 200 l8 -8 l8 8 l-8 8 z"/>
    </g>
    <use href="#row" y="44"/><use href="#row" y="88"/><use href="#row" y="132"/><use href="#row" y="176"/>
  </g>
  <g fill="#9a3412">
    <circle cx="172" cy="222" r="3"/><circle cx="204" cy="222" r="3"/><circle cx="236" cy="222" r="3"/>
    <circle cx="172" cy="266" r="3"/><circle cx="204" cy="266" r="3"/><circle cx="236" cy="266" r="3"/>
    <circle cx="172" cy="310" r="3"/><circle cx="204" cy="310" r="3"/><circle cx="236" cy="310" r="3"/>
    <circle cx="172" cy="354" r="3"/><circle cx="204" cy="354" r="3"/><circle cx="236" cy="354" r="3"/>
  </g>
  <!-- hem border -->
  <rect x="124" y="420" width="152" height="10" fill="#9a3412"/>
  <!-- sleeve borders -->
  <path d="M64 150 L92 176" stroke="#9a3412" stroke-width="8"/>
  <path d="M336 150 L308 176" stroke="#9a3412" stroke-width="8"/>
  <text x="200" y="482" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6a584a">demo product drawing</text>
</svg>
